
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solo Leaving: Erga-se</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; margin: 0 auto; background: url('bg.png') repeat-x bottom; image-rendering: pixelated; }
    #hud {
      position: absolute; top: 10px; left: 10px; color: white;
      font-family: sans-serif; font-size: 16px;
      background: rgba(0,0,0,0.5); padding: 8px; border-radius: 6px;
    }
    #lifeBar {
      height: 10px; background: red; margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="hud">HP: <span id="hpValue">100</span>
    <div id="lifeBar" style="width:100%"></div>
  </div>
  <canvas id="game" width="800" height="400"></canvas>
  <audio id="bgm" src="music.mp3" autoplay loop></audio>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const hpText = document.getElementById("hpValue");
    const lifeBar = document.getElementById("lifeBar");
    let keys = {};
    let gravity = 0.6;
    let canAttack = true;

    const player = {
      x: 50, y: 300, vx: 0, vy: 0,
      width: 40, height: 60,
      color: "cyan", onGround: false, hp: 100
    };

    const enemy = {
      x: 600, y: 300, width: 40, height: 60,
      color: "red", alive: true, hp: 3
    };

    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    function update() {
      player.vx = 0;
      if (keys["ArrowRight"] || keys["d"]) player.vx = 4;
      if (keys["ArrowLeft"] || keys["a"]) player.vx = -4;
      if ((keys[" "] || keys["w"] || keys["ArrowUp"]) && player.onGround) {
        player.vy = -12;
        player.onGround = false;
      }

      player.vy += gravity;
      player.x += player.vx;
      player.y += player.vy;

      if (player.y + player.height >= canvas.height) {
        player.y = canvas.height - player.height;
        player.vy = 0;
        player.onGround = true;
      }

      if ((keys["k"] || keys["K"]) && enemy.alive && canAttack) {
        if (Math.abs(player.x - enemy.x) < 60) {
          enemy.hp--;
          canAttack = false;
          setTimeout(() => canAttack = true, 600);
          if (enemy.hp <= 0) {
            enemy.alive = false;
          }
        }
      }

      // Atualiza HUD
      hpText.textContent = player.hp;
      lifeBar.style.width = player.hp + "%";
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      if (enemy.alive) {
        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
      } else {
        ctx.fillStyle = "gray";
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
